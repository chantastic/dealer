    <path fill-rule="evenodd" d="M5.1 4.3 C7.6 4.3 9.4 5.6 9.4 7.2 C9.4 8.8 7.6 10.1 5.1 10.1 C2.6 10.1 0.8 8.8 0.8 7.2 C0.8 5.6 2.6 4.3 5.1 4.3 Z M5.1 5.9 C3.6 5.9 2.5 6.5 2.5 7.2 C2.5 7.9 3.6 8.5 5.1 8.5 C6.6 8.5 7.7 7.9 7.7 7.2 C7.7 6.5 6.6 5.9 5.1 5.9 Z"/>
    <!-- brim, pointing forward -->
    <path d="M9.9 5.9 L15.4 8.9 C15.8 9.1 15.8 9.6 15.4 9.7 L10.1 10.1 C10.6 8.8 10.5 7.2 9.9 5.9 Z"/>
  </g>
</svg>
