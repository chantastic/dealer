<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" color="#000">
  <!-- Menu-bar template image (concept C, "fanned pair"): two cards fanned from a shared pivot, an
       outlined card behind a solid front card with a knocked-out spade, drawn SF Symbols-style on
       an 18pt canvas. macOS uses only the alpha channel and tints it for light and dark menu bars.
       Other concepts live in menubar-concepts/; to switch, copy one over this file and run
       `make icons`. -->
  <defs>
    <!-- Masks sit on untransformed groups so their coordinates are the canvas's.
         Clears a thin gap around the front card so the back card's outline doesn't touch it. -->
    <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect width="18" height="18" fill="#fff"/>
      <rect x="4.8" y="2.6" width="7.6" height="11.2" rx="1.8" transform="rotate(12 8.6 16.4)" fill="#000" stroke="#000" stroke-width="2"/>
    </mask>
    <mask id="pip" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect width="18" height="18" fill="#fff"/>
      <path transform="rotate(12 8.6 16.4) translate(8.6 8.5) scale(0.7) translate(-9 -9.3)" fill="#000" d="M9 5.4 C7.5 7.1 5.7 8.2 5.7 10.1 C5.7 11.3 6.6 12.1 7.6 12.1 C8.1 12.1 8.5 11.9 8.8 11.6 L8.3 13.3 H9.7 L9.2 11.6 C9.5 11.9 9.9 12.1 10.4 12.1 C11.4 12.1 12.3 11.3 12.3 10.1 C12.3 8.2 10.5 7.1 9 5.4 Z"/>
    </mask>
  </defs>
  <g mask="url(#behind)">
    <rect x="4.8" y="2.6" width="7.6" height="11.2" rx="1.8" transform="rotate(-20 8.6 16.4)" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <g mask="url(#pip)">
    <rect x="4.8" y="2.6" width="7.6" height="11.2" rx="1.8" transform="rotate(12 8.6 16.4)" fill="currentColor"/>
  </g>
</svg>
