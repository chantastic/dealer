<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- Dealer app icon: a dealer's green visor in profile, its brim pointing forward like an arrow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28302f"/>
      <stop offset="1" stop-color="#0f1514"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fcf8a"/>
      <stop offset="1" stop-color="#17895a"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff7c3"/>
      <stop offset="0.55" stop-color="#3ddc91"/>
      <stop offset="1" stop-color="#13965c"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 412pt rounded-square body centered in the canvas. -->
  <rect x="50" y="50" width="412" height="412" rx="92" fill="url(#bg)"/>
  <rect x="51.5" y="51.5" width="409" height="409" rx="90.5" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>

  <g filter="url(#drop)" transform="rotate(-8 256 256)">
    <!-- headband, seen edge-on -->
    <ellipse cx="206" cy="236" rx="104" ry="42" fill="none" stroke="url(#band)" stroke-width="24"/>
    <!-- brim, projecting forward -->
    <path d="M282 212 L422 270 C431 274 431 283 422 286 L290 288 C300 262 297 236 282 212 Z" fill="url(#brim)"/>
    <!-- links being dealt -->
    <path d="M108 318 H176 M132 348 H202" stroke="#3ddc91" stroke-opacity="0.55" stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>
