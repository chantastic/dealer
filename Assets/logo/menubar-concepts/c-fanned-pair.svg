<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="18" height="18" viewBox="0 0 18 18" color="#000">
  <!-- Concept C: two identical cards fanned 20 degrees each way around a shared point at their
       bottom edge, an outlined card behind a solid front card with a knocked-out spade. -->
  <defs>
    <!-- One card shape for both cards. Both are drawn with the same 1.6pt stroke, so their outer
         edges are identical: 7.2 x 13pt with a 2.3pt corner radius, bottom-center at (9, 16.2). -->
    <rect id="card" x="6.2" y="4.0" width="5.6" height="11.4" rx="1.5"/>
    <path id="spade" d="M9 5.4 C7.5 7.1 5.7 8.2 5.7 10.1 C5.7 11.3 6.6 12.1 7.6 12.1 C8.1 12.1 8.5 11.9 8.8 11.6 L8.3 13.3 H9.7 L9.2 11.6 C9.5 11.9 9.9 12.1 10.4 12.1 C11.4 12.1 12.3 11.3 12.3 10.1 C12.3 8.2 10.5 7.1 9 5.4 Z"/>
    <!-- Masks sit on untransformed groups so their coordinates are the canvas's. -->
    <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect width="18" height="18" fill="#fff"/>
      <!-- the front card plus a 1.2pt gap around it -->
      <use xlink:href="#card" transform="rotate(20 9 16.2)" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    </mask>
    <mask id="pip" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect width="18" height="18" fill="#fff"/>
      <use xlink:href="#spade" transform="rotate(20 9 16.2) translate(9 9.7) scale(0.74) translate(-9 -9.3)" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#behind)">
    <use xlink:href="#card" transform="rotate(-20 9 16.2)" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <g mask="url(#pip)">
    <use xlink:href="#card" transform="rotate(20 9 16.2)" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</svg>
