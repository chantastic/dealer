name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build Dealer.app
        run: make app
      - name: Check bundle
        run: |
          plutil -lint build/Dealer.app/Contents/Info.plist
          test "$(plutil -extract CFBundleIdentifier raw build/Dealer.app/Contents/Info.plist)" = "dev.chan.dealer"
          codesign --verify --verbose build/Dealer.app
          build/deal --help

  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
