name: CI

on:
  push:
    # cursor/** covers agent working branches, so they're tested before a PR exists.
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build Dealer.app
        run: make app
      - name: Check bundle
        run: |
          plutil -lint build/Dealer.app/Contents/Info.plist
          test "$(plutil -extract CFBundleIdentifier raw build/Dealer.app/Contents/Info.plist)" = "dev.chan.dealer"
          plutil -extract NSAppleEventsUsageDescription raw build/Dealer.app/Contents/Info.plist
          codesign --verify --verbose build/Dealer.app
          codesign -d --entitlements - build/Dealer.app 2>&1 | grep -q com.apple.security.automation.apple-events
          build/deal --help
      # Same script as the release workflow, without signing secrets (ad-hoc, not notarized).
      - name: Package (release dry run)
        env:
          VERSION: 0.0.0-ci
          BUILD_NUMBER: ${{ github.run_number }}
        run: make package
      - name: Verify package
        env:
          EXPECT_VERSION: 0.0.0
          EXPECT_BUILD: ${{ github.run_number }}
        run: |
          scripts/verify-package.sh
          iconutil --convert iconset build/Dealer.app/Contents/Resources/AppIcon.icns --output build/AppIcon-from-icns.iconset
          ls -l build/AppIcon-from-icns.iconset
      # Exercises make-appcast.sh with Sparkle's real sign_update and a throwaway key, then checks
      # the signature independently with OpenSSL. Sparkle keys are base64 raw Ed25519 seeds.
      - name: Appcast dry run (throwaway EdDSA key)
        env:
          VERSION: 0.0.0-ci
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          openssl="$(brew --prefix openssl@3 2>/dev/null || (brew install --quiet openssl@3 >/dev/null && brew --prefix openssl@3))/bin/openssl"
          keys="$RUNNER_TEMP/sparkle-test"
          mkdir -p "$keys"
          "$openssl" genpkey -algorithm ed25519 -outform DER -out "$keys/private.der"
          "$openssl" pkey -inform DER -in "$keys/private.der" -pubout -outform DER -out "$keys/public.der"
          SPARKLE_PRIVATE_KEY="$(tail -c 32 "$keys/private.der" | base64)" scripts/make-appcast.sh build/Dealer.zip
          xmllint --noout build/appcast.xml
          sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' build/appcast.xml | base64 --decode > "$keys/signature.bin"
          "$openssl" pkeyutl -verify -pubin -keyform DER -inkey "$keys/public.der" -rawin -in build/Dealer.zip -sigfile "$keys/signature.bin"
      - name: Cask dry run
        run: |
          scripts/update-cask.sh 0.0.0-ci build/Dealer.dmg > build/dealer.rb
          ruby -c build/dealer.rb
          grep -q "sha256 \"$(shasum -a 256 build/Dealer.dmg | cut -d' ' -f1)\"" build/dealer.rb
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dealer-package
          path: |
            build/Dealer.dmg
            build/Dealer.zip
            build/SHA256SUMS.txt
            build/AppIcon-from-icns.iconset
            build/appcast.xml
            build/dealer.rb
      - name: Compile the Manage Profiles AppleScript against Chrome's dictionary
        run: |
          ls -d "/Applications/Google Chrome.app"
          build/deal profiles --manage --dry-run --rules "$RUNNER_TEMP/none.json" > "$RUNNER_TEMP/picker.applescript"
          cat "$RUNNER_TEMP/picker.applescript"
          osacompile -o "$RUNNER_TEMP/picker.scpt" "$RUNNER_TEMP/picker.applescript"
      # Actually running the script can't be tested here: macOS shows an Automation consent
      # prompt ("… wants access to control Google Chrome") that nobody can click on a runner.

  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
